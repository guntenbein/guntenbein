# Refreshes the "Latest writing" list in README.md from the site's RSS feed.
name: Latest writing

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://anovikau.com/writing/rss.xml"
          max_post_count: 6
          template: "- [$title]($url) · $date $newline"
          date_format: "mmm d, yyyy"
          commit_message: "Update latest writing"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
